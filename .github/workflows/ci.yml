# Runs the quality gate on every push and every pull request.
#
# It calls the same entry point the pre-commit hook calls, and nothing else. If this file ever grows a
# check of its own, the hook and CI can disagree, and then "green" means two different things.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The gate only reads the repository, so `contents: read` is the whole permission it needs. The deploy
# workflow asks for what it needs separately rather than relying on a wider default here.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # The version comes from .nvmrc so it is pinned in one place. Wrangler needs Node 22 or
          # newer and vitest needs 22.12 or newer, so the pin is a floor as much as a choice.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from the lockfile and deletes anything that does not belong, so
      # the gate runs against the same tree here as it does locally. `npm install` would quietly
      # rewrite the lockfile instead, which is the opposite of what a pinned setup wants.
      - name: Install the tooling
        run: npm ci

      - name: Run the quality gate
        run: npm run check
